apiVersion: apps/v1
kind: Deployment
metadata:
  name: crash-api
  namespace: pipelineguard
  labels: { app: crash-api }
spec:
  replicas: 2
  selector:
    matchLabels: { app: crash-api }
  template:
    metadata:
      labels: { app: crash-api }
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: api
          image: ghcr.io/marvelousjade/pipelineguard-crash-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: crash-intelligence-config }
            - secretRef: { name: crash-intelligence-secrets }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: crash-api
  namespace: pipelineguard
spec:
  selector: { app: crash-api }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: crash-api
  namespace: pipelineguard
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: crash-api }
