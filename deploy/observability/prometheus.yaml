global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/pipelineguard.yaml

scrape_configs:
  - job_name: pipelineguard-dotnet
    static_configs:
      - targets: [otel-collector:8889]

  - job_name: rabbitmq
    static_configs:
      - targets: [rabbitmq:15692]
