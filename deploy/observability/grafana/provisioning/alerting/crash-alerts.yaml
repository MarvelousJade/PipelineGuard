apiVersion: 1

groups:
  - orgId: 1
    name: crash-processing
    folder: PipelineGuard
    interval: 1m
    rules:
      - uid: pg-crash-dead-letters
        title: Crash dead-letter queue is not empty
        condition: threshold
        data:
          - refId: query
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: rabbitmq_queue_messages{queue="pipelineguard.crash.dead-letter"}
              instant: true
              intervalMs: 15000
              maxDataPoints: 43200
              refId: query
          - refId: reduce
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              expression: query
              reducer: last
              type: reduce
              refId: reduce
          - refId: threshold
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              expression: reduce
              type: threshold
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  query: { params: [threshold] }
                  reducer: { params: [], type: last }
                  type: query
              refId: threshold
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          summary: One or more crash reports exhausted worker retries
        labels:
          severity: critical

      - uid: pg-crash-worker-down
        title: Crash queue has no consumer
        condition: threshold
        data:
          - refId: query
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: (rabbitmq_queue_messages{queue="pipelineguard.crash.processing"} > 0) and (rabbitmq_queue_consumers{queue="pipelineguard.crash.processing"} == 0)
              instant: true
              intervalMs: 15000
              maxDataPoints: 43200
              refId: query
          - refId: reduce
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              expression: query
              reducer: last
              type: reduce
              refId: reduce
          - refId: threshold
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              expression: reduce
              type: threshold
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  query: { params: [threshold] }
                  reducer: { params: [], type: last }
                  type: query
              refId: threshold
        noDataState: OK
        execErrState: Error
        for: 2m
        annotations:
          summary: Queued crashes have no active processing worker
        labels:
          severity: critical
